<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Forja do Destino | Criador de Personagem</title>
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="subtitle">RPG - CRIADOR DE PERSONAGEM</p>

            <h1>Forja do Destino</h1>

            <p>
                Crie seu personagem e comece sua própria aventura.
            </p>
        </header>


        <section class="card">

            <h2>Crie seu personagem</h2>

            <form id="characterForm">

                <div class="form-group">
                    <label for="name">Nome do personagem</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Seu nome"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="age">Idade</label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Sua Idade"
                        min="1"
                        max="999"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="race">Raca</label>

                    <select id="race" required>
                        <option value="">Escolha uma raca</option>
                        <option value="Humano">Humano</option>
                        <option value="Elfo">Elfo</option>
                        <option value="Anao">Anao</option>
                        <option value="Orc">Orc</option>
                        <option value="Halfling">Halfling</option>
                        <option value="Draconato">Draconato</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="gender">Genero</label>

                    <select id="gender" required>
                        <option value="">Escolha o genero</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Nao-binario">Nao-binario</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>


                <button type="submit" class="create-button">
                     Criar Personagem
                </button>

            </form>

        </section>

        <div id="notification" class="notification">
             Personagem criado com sucesso!
        </div>


        <section id="characterCard" class="character-card">

            <div class="character-header">
              
                <h2>Ficha do Personagem</h2>
                
            </div>


            <div class="character-info">

                <div class="info-item">
                    <span class="info-label">Nome</span>
                    <span id="characterName">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Idade</span>
                    <span id="characterAge">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Raca</span>
                    <span id="characterRace">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Genero</span>
                    <span id="characterGender">-</span>
                </div>

            </div>


            <div class="quote">
                "Toda grande aventura comeca com uma escolha."
            </div>

        </section>

    </main>


    <footer>
        <p>Forja do Destino - Projeto RPG</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
